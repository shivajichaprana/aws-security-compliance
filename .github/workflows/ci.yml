# Continuous integration for aws-security-compliance.
#
# Three independent gates run in parallel, then a final aggregation job gives a
# single required status for branch protection:
#   1. terraform  — fmt check + backend-less validate
#   2. python     — pytest over the Lambda evaluators
#   3. yaml-lint  — yamllint over the SSM Automation documents
#
# Actions are pinned to major version tags. For a stricter supply-chain posture,
# repin each to a full commit SHA (e.g. actions/checkout@<sha> # v4.x).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repository contents.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_DIR: terraform
  TERRAFORM_VERSION: 1.9.5
  PYTHON_VERSION: "3.12"

jobs:
  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Format check
        run: terraform -chdir=${{ env.TF_DIR }} fmt -check -recursive -diff

      - name: Init (no backend)
        run: terraform -chdir=${{ env.TF_DIR }} init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=${{ env.TF_DIR }} validate

  python:
    name: pytest (lambda evaluators)
    runs-on: ubuntu-latest
    env:
      # Evaluators build boto3 clients at import; a region must be present.
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile Lambda sources
        run: python -m compileall -q lambda

      - name: Run tests
        run: python -m pytest -q

  yaml-lint:
    name: yamllint (ssm documents)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install yamllint
        run: pip install "yamllint>=1.35,<2.0"

      - name: Lint SSM documents
        run: yamllint -c .yamllint.yml ssm-documents

  ci-success:
    name: ci success
    runs-on: ubuntu-latest
    needs: [terraform, python, yaml-lint]
    if: always()
    steps:
      - name: Verify all gates passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more CI gates failed."
            exit 1
          fi
          echo "All CI gates passed."
